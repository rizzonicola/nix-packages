name: update
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.pending.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=$(.github/scripts/pending-updates.sh)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ "$packages" = "[]" ]; then
            echo "All packages are up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Packages to update: \`$packages\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  update:
    needs: check
    if: needs.check.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          package="pkgs/${{ matrix.package }}"
          if [[ -f "$package/nix-update-args" ]]; then
            readarray -t args < "$package/nix-update-args"
            nix run nixpkgs#nix-update -- --flake "${{ matrix.package }}" "${args[@]}"
          else
            nix run nixpkgs#nix-update -- --flake "${{ matrix.package }}"
          fi
      - name: Build only this package
        run: |
          if git diff --quiet; then
            echo "No updates"
          else
            nix build ".#${{ matrix.package }}" --print-build-logs
          fi
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/update-${{ matrix.package }}
          commit-message: "${{ matrix.package }}: automatic update"
          title: "${{ matrix.package }}: automatic update"
          delete-branch: true
